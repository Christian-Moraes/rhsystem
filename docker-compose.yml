version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rhsystem-postgres
    environment:
      POSTGRES_DB: rhsystem
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rhsystem-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rhsystem-backend
    environment:
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-your-256-bit-secret-key-change-in-production-minimum-32-characters}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rhsystem
      # Chave Groq: valor direto do .env.example (sobrescreve com GROQ_API_KEY no .env se quiser)
      GROQ_API_KEY: REMOVIDO
    ports:
      - "8086:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rhsystem-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: rhsystem-frontend
    ports:
      - "3006:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js
      - ./frontend/package.json:/app/package.json
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_TARGET=http://backend:8080
    depends_on:
      - backend
    networks:
      - rhsystem-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  rhsystem-network:
    driver: bridge
