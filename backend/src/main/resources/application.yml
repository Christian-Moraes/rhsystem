spring:
  application:
    name: rhsystem-backend
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rhsystem}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# Groq API (importação por imagem) — env GROQ_API_KEY ou arquivo (atualizar sem reiniciar: echo "gsk_xxx" > /tmp/groq_api_key no container)
groq:
  enabled: ${GROQ_ENABLED:true}
  api-key: ${GROQ_API_KEY:${GROQ_APIKEY:}}
  # Se existir, lê a chave deste arquivo a cada requisição (permite atualizar com docker exec sem derrubar)
  api-key-file: ${GROQ_API_KEY_FILE:/tmp/groq_api_key}
  # Modelo de visão principal (opcional). Se vazio, usa a lista vision-fallbacks.
  model: ${GROQ_MODEL:qwen/qwen3.8-27b}
  # Fallbacks de modelo de visão, em ordem (separados por vírgula). Usados quando model está vazio ou falha.
  vision-fallbacks: ${GROQ_VISION_FALLBACKS:qwen/qwen3.8-27b}
  # Modelo de pensar/raciocínio (fallback). openai/gpt-oss-120b com reasoning_effort=medium.
  thinking-model: ${GROQ_THINKING_MODEL:openai/gpt-oss-120b}

cors:
  # Origens permitidas, separadas por vírgula (em produção: CORS_ALLOWED_ORIGINS=https://seu-dominio)
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3006,http://localhost:80,tauri://localhost,http://tauri.localhost}

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production-minimum-32-characters}
  expiration: 86400000 # 24 horas em milissegundos
  refresh-expiration: 604800000 # 7 dias em milissegundos

logging:
  level:
    com.rhsystem: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
