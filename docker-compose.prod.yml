version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rhsystem-postgres-prod
    environment:
      POSTGRES_DB: rhsystem
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rhsystem-network
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rhsystem-backend-prod
    environment:
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rhsystem
    ports:
      - "8086:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rhsystem-network
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rhsystem-frontend-prod
    ports:
      - "3006:80"
    depends_on:
      - backend
    networks:
      - rhsystem-network
    restart: always

volumes:
  postgres_data:

networks:
  rhsystem-network:
    driver: bridge
